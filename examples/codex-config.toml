# Merge into your personal ~/.codex/config.toml. This example follows stable.
# Use @beta for an isolated beta backend; keep tokens private.
[mcp_servers.vdoc]
command = "npx"
args = ["--yes", "@chnmig/vdoc-mcp@latest"]
startup_timeout_sec = 60
tool_timeout_sec = 180

[mcp_servers.vdoc.env]
VDOC_BASE_URL = "http://127.0.0.1:8080"
VDOC_MCP_TOKEN = "<YOUR_ACTIVE_VDOC_TOKEN>"
